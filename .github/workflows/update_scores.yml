name: Canli Skor Guncelle
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canli Skorlari Cek ve Kaydet
        run: |
          python3 - << 'EOF'
          import json, urllib.request
          from datetime import datetime, timedelta

          leagues = [
              ("tur.1", "Süper Lig"),
              ("uefa.champions", "Şampiyonlar Ligi"),
              ("eng.1", "Premier Lig"),
              ("esp.1", "La Liga"),
              ("ita.1", "Serie A"),
              ("ger.1", "Bundesliga")
          ]
          now = datetime.utcnow() + timedelta(hours=3)
          d1 = (now - timedelta(days=3)).strftime("%Y%m%d")
          d2 = (now + timedelta(days=3)).strftime("%Y%m%d")
          out = {"updated_at": now.strftime("%d.%m.%Y %H:%M"), "leagues": []}
          base = "https://" + "://espn.com" + "/apis/site/v2/sports/soccer/"

          for code, title in leagues:
              url = f"{base}{code}/scoreboard?dates={d1}-{d2}"
              matches = []
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read().decode("utf-8"))
                  for ev in data.get("events", []):
                      comps_list = ev.get("competitions", [])
                      if not comps_list:
                          continue
                      cs = comps_list.get("competitors", [])
                      if len(cs) >= 2:
                          home = next((c for c in cs if c.get("homeAway") == "home"), cs)
                          away = next((c for c in cs if c.get("homeAway") == "away"), cs)
                          st = ev.get("status", {}).get("type", {})
                          state = st.get("state", "")
                          is_live = (state == "in")
                          is_pre = (state == "pre")
                          score = "VS" if is_pre else f"{home.get('score','0')} - {away.get('score','0')}"
                          detail = st.get("shortDetail", st.get("detail", ""))
                          matches.append({
                              "home": home.get("team", {}).get("shortDisplayName", "Ev"),
                              "away": away.get("team", {}).get("shortDisplayName", "Dep"),
                              "score": score,
                              "detail": detail,
                              "live": is_live
                          })
              except Exception:
                  pass
              out["leagues"].append({"name": title, "matches": matches})

          with open("nova_scores.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          EOF
          git config user.name "NovaBot"
          git config user.email "bot@novaiptv.local"
          git add nova_scores.json
          git commit -m "Canli skorlar guncellendi" || exit 0
          git push
