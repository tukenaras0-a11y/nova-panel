name: Canli Skor Guncelle
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canli Skorlari Cek ve 4 Buyukler Uyarisi Uret
        run: |
          python3 - << 'EOF'
          import json, urllib.request
          from datetime import datetime, timedelta, timezone

          leagues = [
              ("tur.1", "4339", "Süper Lig"),
              ("uefa.champions", "4480", "Şampiyonlar Ligi"),
              ("eng.1", "4328", "Premier Lig"),
              ("esp.1", "4335", "La Liga"),
              ("ita.1", "4332", "Serie A"),
              ("ger.1", "4331", "Bundesliga")
          ]
          now_utc = datetime.now(timezone.utc)
          now_tr = now_utc + timedelta(hours=3)
          out = {"updated_at": now_tr.strftime("%d.%m.%Y %H:%M"), "leagues": []}
          espn_host = ".".join(["site", "api", "espn", "com"])
          espn_path = "/".join(["apis", "site", "v2", "sports", "soccer"])
          sdb_host = ".".join(["www", "thesportsdb", "com"])
          sdb_path = "/".join(["api", "v1", "json", "3"])

          big4 = ["galatasaray", "fenerbahce", "fenerbahçe", "besiktas", "beşiktaş", "trabzonspor"]
          auto_alert = None

          for espn_code, sdb_id, title in leagues:
              matches = []
              try:
                  u1 = f"https://{espn_host}/{espn_path}/{espn_code}/scoreboard"
                  req = urllib.request.Request(u1, headers={"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read().decode("utf-8"))
                  for ev in data.get("events", []):
                      comp = next(iter(ev.get("competitions", [])), {})
                      cs = comp.get("competitors", [])
                      if len(cs) >= 2:
                          home = next((c for c in cs if c.get("homeAway") == "home"), next(iter(cs), {}))
                          away = next((c for c in cs if c.get("homeAway") == "away"), next(reversed(cs), {}))
                          h_name = home.get("team", {}).get("shortDisplayName", "Ev")
                          a_name = away.get("team", {}).get("shortDisplayName", "Dep")
                          st = ev.get("status", {})
                          st_type = st.get("type", {})
                          state = st_type.get("state", "")
                          is_live = (state == "in")
                          is_pre = (state == "pre")
                          clock = st.get("displayClock", "")
                          score = "VS" if is_pre else f"{home.get('score','0')} - {away.get('score','0')}"
                          detail = f"CANLI {clock}" if is_live else st_type.get("shortDetail", st_type.get("detail", ""))
                          matches.append({
                              "home": h_name,
                              "away": a_name,
                              "score": score,
                              "detail": detail,
                              "live": is_live
                          })
                          full_txt = f"{h_name} {a_name}".lower()
                          if any(b in full_txt for b in big4) and is_pre:
                              ev_date_str = ev.get("date", "")
                              try:
                                  ev_dt = datetime.fromisoformat(ev_date_str.replace("Z", "+00:00"))
                                  diff_min = (ev_dt - now_utc).total_seconds() / 60.0
                                  if 0 <= diff_min <= 16 and not auto_alert:
                                      auto_alert = {
                                          "id": f"big4_{ev.get('id', now_tr.strftime('%Y%m%d%H'))}",
                                          "title": "⚽ DEV MAÇ BAŞLIYOR!",
                                          "body": f"{h_name} - {a_name} karşılaşması {int(diff_min)} dk sonra başlıyor! Canlı TV spor kanallarından izleyebilirsiniz."
                                      }
                              except Exception:
                                  pass
              except Exception:
                  pass

              if not matches:
                  try:
                      u2 = f"https://{sdb_host}/{sdb_path}/eventspastleague.php?id={sdb_id}"
                      req2 = urllib.request.Request(u2, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req2, timeout=10) as r2:
                          d2 = json.loads(r2.read().decode("utf-8"))
                      for ev in (d2.get("events") or [])[:10]:
                          hs = ev.get("intHomeScore")
                          as_ = ev.get("intAwayScore")
                          has_score = (hs is not None and str(hs) != "")
                          matches.append({
                              "home": ev.get("strHomeTeam", "Ev"),
                              "away": ev.get("strAwayTeam", "Dep"),
                              "score": f"{hs} - {as_}" if has_score else "VS",
                              "detail": ev.get("dateEvent", "MS"),
                              "live": False
                          })
                  except Exception:
                      pass

              matches.sort(key=lambda x: not x.get("live", False))
              out["leagues"].append({"name": title, "matches": matches})

          with open("nova_scores.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          if auto_alert:
              try:
                  with open("nova_panel.json", "r", encoding="utf-8") as pf:
                      pdata = json.load(pf)
                  if pdata.get("notify_id") != auto_alert["id"]:
                      pdata["notify_id"] = auto_alert["id"]
                      pdata["notify_title"] = auto_alert["title"]
                      pdata["notify_body"] = auto_alert["body"]
                      pdata["notify_target"] = "CANLI TV"
                      with open("nova_panel.json", "w", encoding="utf-8") as pf:
                          json.dump(pdata, pf, ensure_ascii=False, indent=2)
              except Exception:
                  pass
          EOF
          git config user.name "NovaBot"
          git config user.email "bot@novaiptv.local"
          git add nova_scores.json nova_panel.json
          git commit -m "Canli skor ve otomatik bildirim guncellendi" || exit 0
          git push
